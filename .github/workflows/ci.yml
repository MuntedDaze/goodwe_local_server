name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: >-
          python -m pytest --cov=custom_components.goodwe_local_server
          --cov-report=term-missing --cov-fail-under=95

  # Provision from scratch the same way a Codex cloud environment does.
  setup-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/setup.sh
      - run: bash scripts/setup.sh
      - run: .venv/bin/python -m pytest -q

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@9e9565e68f5a70d874202871f4c4064d23814235
